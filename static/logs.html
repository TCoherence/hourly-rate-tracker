<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时 VPN 日志 · 工作占用</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script src="/history-calendar.js" defer></script>
  <script src="/logs.js" defer></script>
  <style>
    .log-heading{padding:36px 0 24px}.log-heading p{color:var(--muted);line-height:1.8}
    .log-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .log-status{color:var(--muted);font-size:12px}.log-list{list-style:none;padding:0;margin:0}
    .log-entry{padding:18px 0;border-top:1px solid var(--line);line-height:1.7;overflow-wrap:anywhere}
    .log-meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
    .log-state{font-weight:600;color:var(--ink)}.log-message{margin:7px 0 0;white-space:pre-wrap}
    .log-panel{margin-bottom:36px}.log-empty{padding:24px 0;color:var(--muted)}
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/" data-dashboard-link>工作占用<span class="brand-en">TIME / COST</span></a>
      <a class="icon-button" href="/" data-dashboard-link>返回仪表盘</a>
    </header>
    <main>
      <div class="log-heading">
        <p class="eyebrow">LIVE VPN STATUS</p>
        <h1>实时 VPN 日志<span class="red-period" aria-hidden="true" data-i18n-zh="。" data-i18n-en=".">。</span></h1>
        <p>每 15 秒检测一次 VPN，仅在状态变化时新增日志。页面每 3 秒更新，最近的记录显示在最上方。</p>
      </div>
      <div id="log-error" class="error-banner" role="alert" hidden></div>
      <section class="panel log-panel" aria-label="最近 VPN 状态变化">
        <div class="log-toolbar">
          <span id="log-status" class="log-status" role="status">正在读取本机日志…</span>
          <button id="refresh-log" class="icon-button" type="button">立即刷新</button>
        </div>
        <p id="log-privacy" class="log-empty" hidden>时间已隐藏，日志详情暂时不可见。请回到仪表盘选择显示时间后再查看。</p>
        <p id="log-empty" class="log-empty" hidden>还没有状态日志。启用计时后，首次检测会出现在这里。</p>
        <ol id="log-entries" class="log-list"></ol>
        <p class="panel-footnote">仅显示此 Mac 最近 30 条状态变化，不读取流量或节点信息，也不会改变 VPN 连接。</p>
      </section>
    </main>
  </div>
</body>
</html>
